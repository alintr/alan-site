name: Build and deploy web-site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: "0.170.0"

    - name: Build site
      run: |
        hugo --minify --baseURL "https://alantraedal.no/"
        find public -maxdepth 2 -type f | sort
        test -f public/index.html
        grep -n "alantraedal.no\|localhost:1313" public/index.html

    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
